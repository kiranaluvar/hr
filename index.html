function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;') }
function fmtDate(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; const now=new Date(); if(d.toDateString()===now.toDateString()) return 'Today '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); const days=Math.floor((now-d)/86400000); if(days===1) return 'Yesterday'; if(days>=2&&days<7) return days+' days ago'; return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) }
function fmtDateOnly(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}) }
function fmtDateTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) }
function todayYMD(){ return new Date().toISOString().slice(0,10) }

function userById(id){ return state.users.find(u=>u.user_id===id) }
function userName(id){ const u=userById(id); return u?(u.full_name||u.email):null }
function userInitials(name){ if(!name) return '?'; const p=name.split(/\s+/).filter(Boolean); if(p.length===1) return p[0].slice(0,2).toUpperCase(); return (p[0][0]+p[p.length-1][0]).toUpperCase() }
function userColor(id){ if(!id) return 'bg-stone-400'; let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0; return AVATAR_COLORS[h%AVATAR_COLORS.length] }
function avatar(id,size='sm'){ const u=userById(id); const name=u?.full_name||u?.email||''; const sizes={xs:'w-5 h-5 text-[10px]',sm:'w-6 h-6 text-[11px]',md:'w-8 h-8 text-xs',lg:'w-10 h-10 text-sm'}; return '<div class="'+sizes[size]+' '+userColor(id)+' rounded-full flex items-center justify-center font-semibold text-white shrink-0" title="'+esc(name)+'">'+esc(userInitials(name))+'</div>' }
function avatarWithName(id){ const name=userName(id); if(!name) return '<span class="text-stone-400 text-xs">Unassigned</span>'; return '<div class="flex items-center gap-2">'+avatar(id)+'<span class="text-sm text-stone-700 truncate">'+esc(name)+'</span></div>' }

function applyCandidateFilters(q){
  const f=state.filters
  if(f.search){ const s=f.search.replace(/[%_]/g,''); q=q.or('candidate_name.ilike.%'+s+'%,email.ilike.%'+s+'%,contact_no.ilike.%'+s+'%,current_company.ilike.%'+s+'%') }
  if(f.stageGroup) q=q.eq('stage_group',f.stageGroup)
  if(f.stageSub && f.stageSub!=='__archived__') q=q.eq('stage_sub',f.stageSub)
  if(f.stageSub==='__archived__') q=q.eq('is_archived',true)
  if(f.departments.length) q=q.in('department',f.departments)
  if(f.roles.length) q=q.in('role',f.roles)
  if(f.sources.length) q=q.in('source_detail',f.sources)
  if(f.workMode) q=q.eq('work_mode',f.workMode)
  if(f.noticePeriod) q=q.eq('notice_period',f.noticePeriod)
  if(f.archived==='yes') q=q.eq('is_archived',true)
  if(f.archived==='no') q=q.eq('is_archived',false)
  if(f.createdFrom) q=q.gte('created_at',f.createdFrom)
  if(f.createdTo) q=q.lte('created_at',f.createdTo+'T23:59:59')
  if(f.mineOnly) q=q.eq('recruiter_user_id',state.session.user.id)
  else if(f.recruiterId==='unassigned') q=q.is('recruiter_user_id',null)
  else if(f.recruiterId) q=q.eq('recruiter_user_id',f.recruiterId)
  return q
}

}

async function fetchAllPages(build){
  const all=[]; const pageSize=1000; let from=0
  while(true){
    const {data,error}=await build(from,from+pageSize-1)
    if(error){ return {all,error} }
    all.push(...(data||[])); if(!data||data.length<pageSize) break; from+=pageSize
  }
  return {all,error:null}
}
function computeReportsClientSide(rows, rejectActs, selectActs, ivRows, overdueRows){
  let inProcess=0, offers=0, rejected=0
  const byDay={}, funnelMap={}, bySource={}, byDept={}, byRole={}, recruiterMap={}, candCreated={}, candRecruiter={}
  rows.forEach(c=>{
    candCreated[c.id]=c.created_at; candRecruiter[c.id]=c.recruiter_user_id
    const day=(c.created_at||'').slice(0,10); if(day) byDay[day]=(byDay[day]||0)+1
    if(!c.is_archived) funnelMap[c.stage_group]=(funnelMap[c.stage_group]||0)+1
    const terminal=['Offer','Closed'].includes(c.stage_group)
    if(!c.is_archived && !terminal) inProcess++
    if(c.final_status==='Final Select') offers++
    if(c.final_status==='Rejected'||c.final_status==='Dropped') rejected++
    const sd=c.source_detail||'—'
    if(!bySource[sd]) bySource[sd]={total:0,offers:0}
    bySource[sd].total++; if(c.final_status==='Final Select') bySource[sd].offers++
    if(!c.is_archived && !terminal){ const dep=c.department||'—'; byDept[dep]=(byDept[dep]||0)+1; const rl=c.role||'—'; byRole[rl]=(byRole[rl]||0)+1 }
    const rid=c.recruiter_user_id
    if(rid){ if(!recruiterMap[rid]) recruiterMap[rid]={sourced:0,owned:0,offers:0,interviews:0,overdue:0}; recruiterMap[rid].sourced++; recruiterMap[rid].owned++; if(c.final_status==='Final Select') recruiterMap[rid].offers++ }
  })
  const reasonMap={}
  rejectActs.forEach(a=>{ const k=a.reject_reason==='Other'?(a.reject_reason_other||'Other'):a.reject_reason; reasonMap[k]=(reasonMap[k]||0)+1 })
  let selSum=0, selN=0
  selectActs.forEach(a=>{ const created=candCreated[a.candidate_id]; if(created&&a.completed_at){ const d=(new Date(a.completed_at)-new Date(created))/86400000; if(d>=0){ selSum+=d; selN++ } } })
  ivRows.forEach(iv=>{ const rid=candRecruiter[iv.candidate_id]; if(rid&&recruiterMap[rid]) recruiterMap[rid].interviews++ })
  overdueRows.forEach(o=>{ if(o.user_id&&recruiterMap[o.user_id]) recruiterMap[o.user_id].overdue++ })
  const tiles={ sourced:rows.length, in_process:inProcess, offers, rejected, interviews_scheduled:ivRows.length, avg_days_to_select: selN?Math.round(selSum/selN):0 }
  const daily_sourced=Object.entries(byDay).map(([day,n])=>({day,n}))
  const funnel=Object.entries(funnelMap).map(([stage,n])=>({stage,n}))
  const recruiter_stats=Object.entries(recruiterMap).map(([uid,v])=>{ const u=userById(uid)||{}; return { user_id:uid, full_name:u.full_name, email:u.email, ...v } })
  const source_effectiveness=Object.entries(bySource).map(([source,v])=>({source,total:v.total,offers:v.offers,pct:v.total?Math.round(v.offers/v.total*1000)/10:0})).sort((a,b)=>b.total-a.total)
  const by_department=Object.entries(byDept).map(([department,n])=>({department,n})).sort((a,b)=>b.n-a.n)
  const by_role=Object.entries(byRole).map(([role,n])=>({role,n})).sort((a,b)=>b.n-a.n).slice(0,15)
  const reject_reasons=Object.entries(reasonMap).map(([reason,n])=>({reason,n}))
  return { tiles, daily_sourced, funnel, recruiter_stats, source_effectiveness, by_department, by_role, reject_reasons }
}

async function loadNextActions(){
  const today=todayYMD()
  const monthStart=(()=>{ const d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d.toISOString() })()
  const owner=state.nextActionsOwnerFilter
  const effOwner=(owner==='mine'||(!isAdmin()&&owner!==state.session.user.id&&owner!==''))?state.session.user.id:(owner===''?null:owner)
  const baseQ=()=>{ let q=supabase.from('activities').select('*, candidate:candidates!inner(id,candidate_name,role,department,stage_group,stage_sub,recruiter_user_id,is_archived)',{count:'exact',head:true}).eq('candidate.is_archived',false); if(effOwner) q=q.eq('user_id',effOwner); return q }
  const [o,t,ov,cl]=await Promise.all([
    baseQ().is('completed_at',null).not('scheduled_for','is',null),
    baseQ().is('completed_at',null).eq('scheduled_for',today),
    baseQ().is('completed_at',null).lt('scheduled_for',today),
    baseQ().gte('completed_at',monthStart).not('scheduled_for','is',null),
  ])
  state.nextActionsCounts={ open:o.count||0, today:t.count||0, overdue:ov.count||0, closed:cl.count||0 }
  let q=supabase.from('activities').select('*, candidate:candidates!inner(id,candidate_name,role,department,stage_group,stage_sub,recruiter_user_id,is_archived)').eq('candidate.is_archived',false)
  if(effOwner) q=q.eq('user_id',effOwner)
  if(state.nextActionsFilter==='open') q=q.is('completed_at',null).not('scheduled_for','is',null).order('scheduled_for',{ascending:true})
  else if(state.nextActionsFilter==='today') q=q.is('completed_at',null).eq('scheduled_for',today).order('scheduled_for',{ascending:true})
  else if(state.nextActionsFilter==='overdue') q=q.is('completed_at',null).lt('scheduled_for',today).order('scheduled_for',{ascending:true})
  else q=q.gte('completed_at',monthStart).not('scheduled_for','is',null).order('completed_at',{ascending:false})
  const {data,error}=await q.limit(200)
  if(error){ flash('err',error.message); return }
  state.nextActions=data||[]
}

const CAND_FIELDS=['candidate_name','contact_no','email','source_detail','work_mode','department','sub_department','role','current_company','total_exp','current_ctc','expected_ctc','notice_period','reason_for_change','current_location','resume_url']

async function submitActivity(form){
  if(state.saving) return
  const c=state.currentCandidate
  const activityType=form.activity_type.value
  const newGroup=form.new_stage_group?.value||''
  const newSub=form.new_stage_sub?.value||''
  const scheduledFor=form.scheduled_for?.value||null
  const effSub=newSub||c.stage_sub
  const effGroup=newGroup||c.stage_group

  const interviewDate=form.interview_date?.value||null
  const interviewTime=form.interview_time?.value||null
  const interviewer=form.interviewer?.value?.trim()||null
  if(newSub && needsInterview(newSub) && !interviewDate){ flash('err','Add the interview date before saving this stage.'); return }

  const rejectReason=form.reject_reason?.value||null
  const rejectOther=form.reject_reason_other?.value?.trim()||null
  if(newSub && isRejectSub(newSub) && !rejectReason){ flash('err','Select a reason for the rejection / drop.'); return }

  const noFollowup=isTerminalSub(effSub)||c.is_archived
  const needFollowup=!noFollowup
  if(needFollowup && !scheduledFor){ flash('err','Set the next action date, or move to a terminal stage (Reject / Drop / Final Select).'); return }

  state.saving=true; render()
  const nowIso=new Date().toISOString()
  const round=roundFromSub(effSub)

  const primary={
    candidate_id:c.id, user_id:state.session.user.id, activity_type:activityType,
    outcome:form.outcome?.value?.trim()||null, notes:form.notes?.value?.trim()||null,
    scheduled_for:scheduledFor, completed_at:nowIso,
    stage_group_at_time:effGroup, stage_sub_at_time:effSub,
    interview_round:round, interviewer:interviewer,
    interview_datetime:(interviewDate?(interviewDate+'T'+(interviewTime||'09:00')):null),
    reject_reason:rejectReason, reject_reason_other:(rejectReason==='Other'?rejectOther:null),
  }
  const {error:insErr}=await supabase.from('activities').insert(primary)
  if(insErr){ state.saving=false; flash('err',insErr.message); render(); return }

  // close any open next-action for this candidate+user
  await supabase.from('activities').update({completed_at:nowIso,outcome:'Closed by '+activityType+' activity'})
    .eq('candidate_id',c.id).eq('user_id',state.session.user.id).is('completed_at',null).not('scheduled_for','is',null)

  // create next action
  if(scheduledFor && needFollowup){
    await supabase.from('activities').insert({ candidate_id:c.id, user_id:state.session.user.id, activity_type:activityType,
      notes:'Next action scheduled from '+fmtDateOnly(nowIso), scheduled_for:scheduledFor, completed_at:null,
      stage_group_at_time:effGroup, stage_sub_at_time:effSub })
  }

  // stage change + final_status
  if(newGroup||newSub){
    const patch={}
    if(newGroup) patch.stage_group=newGroup
    if(newSub) patch.stage_sub=newSub
    if(newSub==='Final Select') patch.final_status='Final Select'
    else if(isRejectSub(newSub)) patch.final_status=(newSub==='Candidate Drop'?'Dropped':'Rejected')
    await supabase.from('candidates').update(patch).eq('id',c.id)
  }

  // interview slot
  if(newSub && needsInterview(newSub) && interviewDate){
    await supabase.from('interview_schedule').insert({ candidate_id:c.id, round:round, interview_date:interviewDate, interview_time:interviewTime||null, interviewer:interviewer, created_by:state.session.user.id })
  }

  await Promise.all([loadCandidate(c.id),loadActivities(c.id),loadInterviews(c.id),loadMyOverdueCount()])
  state.saving=false
  flash('ok', noFollowup?'Activity logged':'Activity logged · next action scheduled')
  if(newSub==='Final Select') celebrate()
  render()
}

async function submitNewCandidate(form){
  if(state.saving) return
  state.dupWarning=null
  const dupEmail=(form.email?.value||'').trim()
  const dupPhone=(form.contact_no?.value||'').trim()
  // hard-block duplicates: refuse if this email OR phone already exists
  if(dupEmail||dupPhone){
    state.saving=true; render()
    const conds=[]
    if(dupEmail) conds.push('email.ilike.'+dupEmail.replace(/[(),]/g,''))
    if(dupPhone) conds.push('contact_no.eq.'+dupPhone.replace(/[(),]/g,''))
    const {data:dups}=await supabase.from('candidates').select('id,candidate_name,email,contact_no').or(conds.join(',')).limit(1)
    if(dups&&dups.length){
      const d=dups[0]
      const why=(dupEmail&&d.email&&d.email.toLowerCase()===dupEmail.toLowerCase())?'email':'phone number'
      state.saving=false
      state.dupWarning={ id:d.id, name:d.candidate_name||('ID '+d.id), why }
      flash('err','Candidate already exists (same '+why+')')
      render(); return
    }
  }
  state.saving=true; render()
  const row={ created_by:state.session.user.id, recruiter_user_id:state.session.user.id, stage_group:'New', stage_sub:'Sourced' }
  CAND_FIELDS.forEach(f=>{ const v=form[f]?.value?.trim(); if(v) row[f]=v })
  if(row.source_detail) row.source_type=SOURCE_TYPE_MAP[row.source_detail]||null
  ;['total_exp','current_ctc','expected_ctc'].forEach(k=>{ if(row[k]!==undefined) row[k]=Number(row[k])||null })
  const file=form.resume_file?.files?.[0]||null
  const {data,error}=await supabase.from('candidates').insert(row).select('id').single()
  if(error){ state.saving=false; flash('err',error.message); render(); return }
  if(file){ try{ const path=await uploadResume(data.id,file); await supabase.from('candidates').update({resume_url:path}).eq('id',data.id) }catch(upErr){ state.saving=false; state.newDraft={}; flash('err','Candidate saved, but CV upload failed: '+upErr.message); window.location.hash='#/candidates/'+data.id; return } }
  state.saving=false
  state.newDraft={}
  flash('ok', file?'Candidate added · CV uploaded':'Candidate added')
  window.location.hash='#/candidates/'+data.id
}

async function exportCsv(){
  if(state.exporting) return
  state.exporting=true; render()
  const all=[]; const pageSize=1000; let from=0
  while(true){
    let q=supabase.from('candidates').select('id,candidate_name,contact_no,email,source_detail,source_type,work_mode,department,sub_department,role,current_company,total_exp,current_ctc,expected_ctc,notice_period,current_location,reason_for_change,resume_url,recruiter_user_id,stage_group,stage_sub,final_status,is_archived,created_at,last_activity_at').order('created_at',{ascending:false}).range(from,from+pageSize-1)
    q=applyCandidateFilters(q)
    const {data,error}=await q
    if(error){ state.exporting=false; flash('err',error.message); render(); return }

  }

  const q=(v)=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s }
  const lines=[headers.map(q).join(',')]
  for(const r of all) lines.push([r.id,r.candidate_name,r.contact_no,r.email,r.source_detail,r.source_type,r.work_mode,r.department,r.sub_department,r.role,r.current_company,r.total_exp,r.current_ctc,r.expected_ctc,r.notice_period,r.current_location,r.reason_for_change,r.resume_url,userName(r.recruiter_user_id)||'',r.stage_group,r.stage_sub,r.final_status,r.is_archived?'Yes':'No',r.created_at,r.last_activity_at||''].map(q).join(','))
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='candidates-'+todayYMD()+'.csv'; a.click(); URL.revokeObjectURL(url)
  state.exporting=false; flash('ok','Exported '+all.length+' rows'); render()
}

  if(hash.startsWith('/candidates/')&&state.currentCandidate) return '<a href="#/candidates" class="hover:text-stone-900">Candidates</a> <span class="text-stone-300">/</span> <span class="text-stone-900">'+esc(state.currentCandidate.candidate_name||'Candidate')+'</span>'

  if(hash==='/team') return '<span class="text-stone-900">Team</span>'
  if(hash==='/reports') return '<span class="text-stone-900">Reports</span>'
  return '<span class="text-stone-900">Candidates</span>'
}
function renderCurrentView(){
  switch(state.view){
    case 'candidates-list': return renderCandidatesList()
    case 'candidate-detail': return renderCandidateDetail()
    case 'candidate-new': return renderCandidateNew()
    case 'next-actions': return renderNextActions()
    case 'team': return renderTeam()
    case 'reports': return renderReports()
    default: return renderCandidatesList()
  }
}

function multiSelectDropdown(key,allLabel,options,selected,opts){
  opts=opts||{}
  const isOpen=state.openFilter===key
  const n=selected.length
  let btnLabel = n===0?allLabel : (n===1?(options.find(o=>o.value===selected[0])?.label||selected[0]):n+' selected')
  const btnCls='text-sm px-3 py-1.5 border rounded-md bg-white focus-ring flex items-center gap-1.5 whitespace-nowrap '+(n>0?'border-indigo-300 text-indigo-700 bg-indigo-50/50':'border-stone-200 text-stone-700')
  let panel=''
  if(isOpen){
    const term=(state.filterSearch[key]||'').toLowerCase()
    const vis=opts.searchable&&term?options.filter(o=>o.label.toLowerCase().includes(term)):options
    const searchBox=opts.searchable?'<input type="text" placeholder="Search…" value="'+esc(state.filterSearch[key]||'')+'" data-action="filter-dropdown-search" data-key="'+key+'" class="w-full text-xs px-2 py-1.5 border border-stone-200 rounded-md mb-1.5 focus-ring">':''
    const rows=vis.length===0?'<div class="text-xs text-stone-400 text-center py-3">No matches</div>':vis.map(o=>'<label class="flex items-center gap-2 px-1.5 py-1 hover:bg-stone-50 rounded cursor-pointer text-sm"><input type="checkbox" data-action="filter-dropdown-toggle" data-key="'+key+'" data-value="'+esc(o.value)+'" class="rounded border-stone-300 text-indigo-600 focus:ring-indigo-400"'+(selected.includes(o.value)?' checked':'')+'><span class="truncate">'+esc(o.label)+'</span></label>').join('')
    panel='<div class="absolute z-30 mt-1 w-64 bg-white border border-stone-200 rounded-lg shadow-lg p-2" data-no-row-click>'+searchBox+'<div class="max-h-56 overflow-y-auto space-y-0.5">'+rows+'</div><div class="flex items-center justify-between pt-2 mt-1 border-t border-stone-100"><button data-action="filter-dropdown-clear" data-key="'+key+'" class="text-xs text-stone-500 hover:text-stone-900">Clear</button><button data-action="filter-dropdown-done" class="text-xs text-indigo-600 font-medium">Done</button></div></div>'
  }
  const backdrop=isOpen?'<div data-action="close-filter-dropdown" class="fixed inset-0 z-20"></div>':''
  return backdrop+'<div class="relative" data-no-row-click><button type="button" data-action="toggle-filter-dropdown" data-key="'+key+'" class="'+btnCls+'">'+esc(btnLabel)+' <span class="text-stone-400">▾</span></button>'+panel+'</div>'
}

function renderCandidatesList(){
  const totalPages=Math.max(1,Math.ceil(state.candidatesTotal/PAGE_SIZE))
  const page=state.candidatesPage
  const start=(page-1)*PAGE_SIZE+1, end=Math.min(page*PAGE_SIZE,state.candidatesTotal)

  const allPageIds=state.candidates.map(c=>c.id)
  const allSel=allPageIds.length>0&&allPageIds.every(id=>state.selectedIds.has(id))

  const subOpts=(STAGE_SUBS[f.stageGroup]||[]).map(s=>'<option value="'+esc(s)+'"'+(f.stageSub===s?' selected':'')+'>'+esc(s)+'</option>').join('')

  const rows=state.candidates.length===0
    ? '<tr><td colspan="7" class="text-center text-stone-400 py-12 text-sm">No candidates match these filters.</td></tr>'

      const sel=state.selectedIds.has(c.id)

    }).join('')

  const bulkBar=state.selectedIds.size>0?'<div class="mb-3 flex items-center gap-3 bg-indigo-50 border border-indigo-200 rounded-lg px-4 py-2.5"><span class="text-sm font-medium text-indigo-800">'+state.selectedIds.size+' selected</span>'+(isAdmin()?'<select data-action="bulk-reassign-change" class="text-sm px-2.5 py-1 border border-indigo-200 rounded-md bg-white focus-ring"><option value="">Reassign to…</option><option value="UNASSIGN">Unassign</option>'+state.users.map(u=>'<option value="'+esc(u.user_id)+'">'+esc(u.full_name||u.email)+'</option>').join('')+'</select><button data-action="bulk-delete-confirm" class="text-sm text-rose-600 hover:text-rose-800 font-medium">Delete</button>':'')+'<button data-action="clear-selection" class="text-sm text-stone-500 hover:text-stone-800 ml-auto">Clear</button></div>':''

  const deleteModal=state.bulkPanel==='delete-confirm'?'<div class="fixed inset-0 bg-black/40 z-50 flex items-center justify-center px-4" data-action="close-modal"><div class="bg-white rounded-lg p-6 max-w-sm w-full"><h3 class="text-base font-semibold text-stone-900 mb-2">Delete '+state.selectedIds.size+' candidate'+(state.selectedIds.size===1?'':'s')+'?</h3><p class="text-sm text-stone-500 mb-4">This permanently removes them and their activity. Type <span class="font-mono font-semibold">delete '+state.selectedIds.size+'</span> to confirm.</p><input type="text" data-action="bulk-delete-input" placeholder="delete '+state.selectedIds.size+'" class="w-full text-sm px-3 py-2 border border-stone-200 rounded-md mb-4 focus-ring"><div class="flex gap-2 justify-end"><button data-action="cancel-bulk" class="text-sm text-stone-600 px-3 py-1.5">Cancel</button><button id="bulk-delete-execute" data-action="bulk-delete-execute" disabled class="text-sm bg-rose-600 disabled:bg-rose-300 text-white px-3 py-1.5 rounded-md font-medium">Delete</button></div></div></div>':''

  return '<div class="mb-5 flex items-end justify-between flex-wrap gap-3"><div><h1 class="text-xl font-semibold tracking-tight text-stone-900">Candidates</h1><p class="text-sm text-stone-500 mt-0.5">'+state.candidatesTotal.toLocaleString()+' in pipeline'+(state.candidatesTotal>0?' · showing '+start+'–'+end:'')+'</p></div>'+(isAdmin()?'<button data-action="export-csv"'+(state.exporting?' disabled':'')+' class="text-sm border border-stone-200 hover:border-stone-400 text-stone-700 px-3 py-1.5 rounded-md transition">'+(state.exporting?'Exporting…':'Export CSV')+'</button>':'')+'</div>'

    + '<select data-action="filter-stage-group-change" class="text-sm px-3 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"><option value="">All stages</option>'+STAGE_GROUPS.map(g=>'<option value="'+esc(g)+'"'+(f.stageGroup===g?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>'+stageSubSelect
    + multiSelectDropdown('departments','All departments',DEPARTMENTS.map(d=>({value:d,label:d})),f.departments,{searchable:true})
    + multiSelectDropdown('roles','All roles',ROLES.map(r=>({value:r,label:r})),f.roles,{searchable:true})
    + multiSelectDropdown('sources','All sources',SOURCE_DETAILS.map(s=>({value:s,label:s})),f.sources,{searchable:true})
    + '<select data-action="filter-workmode-change" class="text-sm px-3 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"><option value="">Any work mode</option>'+WORK_MODES.map(w=>'<option value="'+esc(w)+'"'+(f.workMode===w?' selected':'')+'>'+esc(w)+'</option>').join('')+'</select>'
    + '<select data-action="filter-notice-change" class="text-sm px-3 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"><option value="">Any notice</option>'+NOTICE_PERIODS.map(nn=>'<option value="'+esc(nn)+'"'+(f.noticePeriod===nn?' selected':'')+'>'+esc(nn)+'</option>').join('')+'</select>'
    + '<select data-action="filter-recruiter-change" class="text-sm px-3 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"'+(f.mineOnly?' disabled':'')+'><option value="">All recruiters</option><option value="unassigned"'+(f.recruiterId==='unassigned'?' selected':'')+'>Unassigned</option>'+recruiterOpts+'</select>'
    + '<button data-action="toggle-mine" class="text-sm px-3 py-1.5 border rounded-md transition '+(f.mineOnly?'border-indigo-300 bg-indigo-50 text-indigo-700':'border-stone-200 text-stone-700')+'">Mine only</button>'
    + '<button data-action="clear-filters" class="text-sm text-stone-500 hover:text-stone-800 px-2">Clear</button></div>'
    + bulkBar
    + '<div class="bg-white border border-stone-200 rounded-lg overflow-hidden"><div class="overflow-x-auto"><table class="w-full"><thead class="bg-stone-50 border-b border-stone-200"><tr class="text-left text-xs font-medium text-stone-500 uppercase tracking-wider"><th class="py-2.5 px-4 w-10"><input type="checkbox" data-action="toggle-select-all" class="rounded border-stone-300 text-indigo-600"'+(allSel?' checked':'')+'></th><th class="py-2.5 px-3">ID</th><th class="py-2.5 px-4">Candidate</th><th class="py-2.5 px-4">Stage</th><th class="py-2.5 px-4">Recruiter</th><th class="py-2.5 px-4">Last activity</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div></div>'
    + '<div class="mt-4 flex items-center justify-between"><div class="text-sm text-stone-500">Page '+page+' of '+totalPages+'</div><div class="flex gap-2"><button data-action="page-prev"'+(page<=1?' disabled':'')+' class="text-sm px-3 py-1.5 border border-stone-200 rounded-md disabled:opacity-40 hover:border-stone-400">Previous</button><button data-action="page-next"'+(page>=totalPages?' disabled':'')+' class="text-sm px-3 py-1.5 border border-stone-200 rounded-md disabled:opacity-40 hover:border-stone-400">Next</button></div></div>'
}

function renderCandidateDetail(){
  const c=state.currentCandidate
  if(!c) return '<div class="text-stone-500 text-sm">Loading candidate…</div>'
  const editable=canEdit(c)
  const userOpts=state.users.map(u=>'<option value="'+esc(u.user_id)+'"'+(c.recruiter_user_id===u.user_id?' selected':'')+'>'+esc(u.full_name||u.email)+'</option>').join('')
  const ownerSlot=editable&&!c.recruiter_user_id?'<button data-action="take-ownership" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded-md font-medium">Assign to me</button>':avatarWithName(c.recruiter_user_id)

  const myPending=state.activities.find(a=>!a.completed_at&&a.scheduled_for&&a.user_id===state.session.user.id)
  let banner=''
  if(myPending){ const today=todayYMD(); const overdue=myPending.scheduled_for<today; const isToday=myPending.scheduled_for===today; const tone=overdue?{bg:'bg-rose-50',bd:'border-rose-200',tx:'text-rose-700',icon:'⚠'}:isToday?{bg:'bg-amber-50',bd:'border-amber-200',tx:'text-amber-800',icon:'⏰'}:{bg:'bg-indigo-50',bd:'border-indigo-200',tx:'text-indigo-700',icon:'📌'}; const label=overdue?'Overdue next action':(isToday?'Next action due today':'Next action scheduled'); banner='<div class="mb-4 '+tone.bg+' border '+tone.bd+' rounded-lg px-4 py-3 flex items-center gap-3"><span class="text-base">'+tone.icon+'</span><div class="text-sm flex-1"><span class="'+tone.tx+' font-semibold">'+label+':</span> <span class="text-stone-700">'+esc(myPending.activity_type)+' on '+esc(fmtDateOnly(myPending.scheduled_for))+'</span></div><div class="text-xs text-stone-500">Log an activity to close it →</div></div>' }

  const activityItems=state.activities.length===0?'<div class="text-sm text-stone-400 py-8 text-center">No activity logged yet.</div>':state.activities.map(a=>{
    const st=ACTIVITY_TYPE_COLORS[a.activity_type]||ACTIVITY_TYPE_COLORS['Other']
    const pending=!a.completed_at&&a.scheduled_for
    const bits=[]
    if(a.stage_sub_at_time) bits.push(esc(a.stage_sub_at_time))
    if(a.interview_datetime) bits.push('🗓 '+esc(fmtDateOnly(a.interview_datetime.slice(0,10))))
    if(a.reject_reason) bits.push('✕ '+esc(a.reject_reason==='Other'?(a.reject_reason_other||'Other'):a.reject_reason))
    return '<div class="py-3 border-b border-stone-100 last:border-0" style="border-left:2px solid '+st.border+';padding-left:12px;margin-left:2px"><div class="flex items-center justify-between gap-3 flex-wrap"><div class="flex items-center gap-2"><span class="text-sm font-medium text-stone-900">'+esc(a.activity_type)+'</span>'+(pending?'<span class="text-[10px] font-semibold uppercase tracking-wider text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">Pending · '+esc(fmtDateOnly(a.scheduled_for))+'</span>':'')+'</div><div class="text-xs text-stone-400">'+esc(fmtDate(a.completed_at||a.created_at))+' · '+esc((userName(a.user_id)||'').split(' ')[0])+'</div></div>'+(a.outcome?'<div class="text-sm text-stone-700 mt-1">'+esc(a.outcome)+'</div>':'')+(a.notes?'<div class="text-xs text-stone-500 mt-1 whitespace-pre-wrap">'+esc(a.notes)+'</div>':'')+(bits.length?'<div class="text-xs text-stone-400 mt-1">'+bits.join(' · ')+'</div>':'')+'</div>'
  }).join('')

  return banner+'<div class="mb-5 flex items-start justify-between gap-4 flex-wrap"><div><div class="text-xs text-stone-400 font-mono mb-1">ID '+esc(c.id)+'</div><h1 class="text-2xl font-semibold tracking-tight text-stone-900">'+esc(c.candidate_name||'Unnamed candidate')+(c.is_archived?' <span class="text-sm font-medium text-stone-600 bg-stone-100 border border-stone-200 px-2 py-0.5 rounded-md ml-2">Archived</span>':'')+'</h1><div class="text-sm text-stone-500 mt-1">'+esc([c.role,c.department,c.current_location].filter(Boolean).join(' · '))+'</div></div><div class="flex items-center gap-3 flex-wrap justify-end">'+stagePill(c.stage_group,c.stage_sub)+ownerSlot+'</div></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-1 space-y-6">'+renderActivityForm(c)+renderArchivePanel(c)+(isAdmin()?renderAdminPanel(userOpts):'')+'</div><div class="lg:col-span-2 space-y-6">'+(state.editingCandidate?renderCandidateEditForm(c):renderCandidateFields(c,editable))+renderInterviewSection()+'<section class="bg-white border border-stone-200 rounded-lg"><header class="px-4 py-3 border-b border-stone-200"><h2 class="text-sm font-semibold text-stone-900">Activity timeline <span class="text-stone-400 font-normal">('+state.activities.length+')</span></h2></header><div class="p-4">'+activityItems+'</div></section>'+renderAuditLogSection(c)+'</div></div>'
}

function renderAdminPanel(userOpts){ return '<section class="bg-white border border-stone-200 rounded-lg"><header class="px-4 py-3 border-b border-stone-200"><h2 class="text-sm font-semibold text-stone-900">Admin</h2></header><div class="p-4"><label class="block text-xs font-medium text-stone-600 mb-1">Reassign recruiter</label><select data-action="reassign-recruiter" class="w-full text-sm px-2.5 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"><option value="">Unassigned</option>'+userOpts+'</select></div></section>' }

  const phoneRow=(label,num)=>{ if(!num) return fieldRow(label,''); const cc=cleanPhone(num); const acts=cc?'<a href="tel:'+cc+'" class="text-xs font-medium text-blue-600 hover:underline">📞 Call</a><a href="sms:'+cc+'" class="text-xs font-medium text-stone-600 hover:underline">💬 SMS</a><a href="https://wa.me/'+cc.replace('+','')+'" target="_blank" rel="noopener" class="text-xs font-medium text-emerald-600 hover:underline">🟢 WhatsApp</a>':''; return '<div class="py-2 grid grid-cols-3 gap-3 border-b border-stone-100 last:border-0"><dt class="text-xs uppercase tracking-wider font-medium">'+esc(label)+'</dt><dd class="col-span-2 text-sm flex flex-wrap items-center gap-x-3 gap-y-1"><span>'+esc(num)+'</span>'+acts+'</dd></div>' }
  const emailRow=(label,em)=>{ if(!em) return fieldRow(label,''); return '<div class="py-2 grid grid-cols-3 gap-3 border-b border-stone-100 last:border-0"><dt class="text-xs uppercase tracking-wider font-medium">'+esc(label)+'</dt><dd class="col-span-2 text-sm"><a href="mailto:'+esc(em)+'" class="text-indigo-600 hover:underline break-all">'+esc(em)+'</a></dd></div>' }
  const linkRow=(label,url)=>{ if(!url) return fieldRow(label,''); const isLink=/^https?:/.test(url); const ctrl=isLink?'<a href="'+esc(url)+'" target="_blank" rel="noopener" class="text-indigo-600 hover:underline break-all">Open resume ↗</a>':'<button type="button" data-action="open-resume" data-path="'+esc(url)+'" class="text-indigo-600 hover:underline">Open CV ↗</button>'; return '<div class="py-2 grid grid-cols-3 gap-3 border-b border-stone-100 last:border-0"><dt class="text-xs uppercase tracking-wider font-medium">'+esc(label)+'</dt><dd class="col-span-2 text-sm">'+ctrl+'</dd></div>' }

  const money=(v)=>v?('₹ '+Number(v).toLocaleString('en-IN')):null

    + fieldRow('Total experience',c.total_exp?c.total_exp+' yrs':null)+fieldRow('Current company',c.current_company)

function selField(label,name,options,current,opts){ opts=opts||{}; const req=opts.required?' required':''; const star=opts.required?' <span class="text-rose-500">*</span>':''; const o='<option value="">— Select —</option>'+options.map(v=>'<option'+(current===v?' selected':'')+'>'+esc(v)+'</option>').join(''); return '<div class="'+(opts.colSpan||'')+'"><label class="block text-xs font-medium text-stone-600 mb-1">'+esc(label)+star+'</label><select name="'+name+'"'+req+' class="w-full text-sm px-2.5 py-1.5 border border-stone-200 rounded-md bg-white focus-ring">'+o+'</select></div>' }
function inpField(label,name,value,opts){ opts=opts||{}; const req=opts.required?' required':''; const star=opts.required?' <span class="text-rose-500">*</span>':''; const type=opts.type||'text'; const list=opts.list?' list="'+opts.list+'"':''; const tag=type==='textarea'?'<textarea name="'+name+'" rows="2"'+req+' class="w-full text-sm px-2.5 py-1.5 border border-stone-200 rounded-md focus-ring">'+esc(value||'')+'</textarea>':'<input type="'+type+'" name="'+name+'"'+list+req+(value?' value="'+esc(value)+'"':'')+' class="w-full text-sm px-2.5 py-1.5 border border-stone-200 rounded-md focus-ring" autocomplete="off">'; return '<div class="'+(opts.colSpan||'')+'"><label class="block text-xs font-medium text-stone-600 mb-1">'+esc(label)+star+'</label>'+tag+'</div>' }

function resumeField(d){
  const cur=d.resume_url

  return '<div class="md:col-span-2"><label class="block text-xs font-medium text-stone-600 mb-1">Resume / CV</label>'+curHtml
    +'<input type="file" name="resume_file" accept=".pdf,.doc,.docx,.rtf,.txt,image/*" class="w-full text-sm text-stone-600 file:mr-3 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 border border-stone-200 rounded-md p-1.5">'

    +'</div>'

async function uploadResume(candidateId, file){
  const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')
  const path=candidateId+'/cv_'+Date.now()+'.'+ext
  const {error}=await supabase.storage.from('resumes').upload(path, file, {upsert:true, contentType:file.type||undefined})
  if(error) throw error
  return path
}
async function openResume(pathOrUrl){
  if(/^https?:/.test(pathOrUrl)){ window.open(pathOrUrl,'_blank','noopener'); return }
  const {data,error}=await supabase.storage.from('resumes').createSignedUrl(pathOrUrl, 120)
  if(error){ flash('err','Could not open CV: '+error.message); return }
  window.open(data.signedUrl,'_blank','noopener')
}

function renderNextActions(){
  const today=todayYMD()
  const counts=state.nextActionsCounts
  const items=state.nextActions
  const kpiCard=(label,value,key,accent)=>{ const active=state.nextActionsFilter===key; return '<button data-action="set-na-filter" data-filter="'+key+'" class="text-left bg-white border rounded-lg p-4 transition '+(active?'border-indigo-500 ring-2 ring-indigo-100':'border-stone-200 hover:border-stone-300')+'"><div class="text-xs font-medium uppercase tracking-wider text-stone-500">'+esc(label)+'</div><div class="text-2xl font-semibold mt-1 '+accent+'">'+value.toLocaleString()+'</div></button>' }
  let ownerOptions
  if(isAdmin()) ownerOptions='<option value="mine"'+(state.nextActionsOwnerFilter==='mine'?' selected':'')+'>Just mine</option><option value=""'+(state.nextActionsOwnerFilter===''?' selected':'')+'>All team</option>'+state.users.map(u=>u.user_id===state.session.user.id?'':'<option value="'+esc(u.user_id)+'"'+(state.nextActionsOwnerFilter===u.user_id?' selected':'')+'>'+esc(u.full_name||u.email)+'</option>').join('')
  else ownerOptions='<option value="mine" selected>Just mine</option>'

  let listHtml
  if(items.length===0){ const msg=state.nextActionsFilter==='closed'?'No closed actions this month.':state.nextActionsFilter==='today'?'Nothing due today.':'Nothing here. Nice work.'; listHtml='<div class="bg-white border border-stone-200 rounded-lg px-6 py-12 text-center"><div class="text-base font-medium text-stone-700">All clear</div><div class="text-sm text-stone-500 mt-1">'+msg+'</div></div>' }
  else if(state.nextActionsFilter==='closed') listHtml='<section class="bg-white border border-stone-200 rounded-lg overflow-hidden"><ul class="divide-y divide-stone-100">'+items.map(f=>renderNextActionItem(f,today)).join('')+'</ul></section>'
  else { const groups={overdue:[],today:[],upcoming:[]}; for(const f of items){ if(!f.scheduled_for) continue; if(f.scheduled_for<today) groups.overdue.push(f); else if(f.scheduled_for===today) groups.today.push(f); else groups.upcoming.push(f) } const grp=(title,arr,dot)=>arr.length===0?'':'<section class="bg-white border border-stone-200 rounded-lg overflow-hidden"><header class="px-4 py-3 border-b border-stone-200 flex items-center justify-between"><h2 class="text-sm font-semibold text-stone-900">'+title+' <span class="text-stone-400 font-normal">('+arr.length+')</span></h2><span class="w-2 h-2 rounded-full '+dot+'"></span></header><ul class="divide-y divide-stone-100">'+arr.map(f=>renderNextActionItem(f,today)).join('')+'</ul></section>'; listHtml=grp('Overdue',groups.overdue,'bg-rose-500')+grp('Due today',groups.today,'bg-amber-500')+grp('Upcoming',groups.upcoming,'bg-stone-300') }

  const subtitle=isAdmin()?'Actions across the team. Click a card to switch view.':'Your open actions. Each stays open until you log an activity.'
  return '<div class="mb-5"><h1 class="text-xl font-semibold tracking-tight text-stone-900">My pipeline</h1><p class="text-sm text-stone-500 mt-0.5">'+subtitle+'</p></div><div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5 max-w-3xl">'+kpiCard('Open',counts.open||0,'open','text-stone-900')+kpiCard('Today',counts.today||0,'today',(counts.today||0)>0?'text-amber-600':'text-stone-900')+kpiCard('Overdue',counts.overdue||0,'overdue',(counts.overdue||0)>0?'text-rose-600':'text-stone-900')+kpiCard('Closed this month',counts.closed||0,'closed','text-emerald-700')+'</div><div class="mb-5 flex items-center gap-3"><label class="text-xs font-medium text-stone-600 uppercase tracking-wider">Recruiter</label><select data-action="na-owner-change" class="text-sm px-3 py-1.5 border border-stone-200 rounded-md bg-white focus-ring"'+(isAdmin()?'':' disabled')+'>'+ownerOptions+'</select></div><div class="space-y-6 max-w-3xl">'+listHtml+'</div>'
}
function renderNextActionItem(f,today){
  const ts=ACTIVITY_TYPE_COLORS[f.activity_type]||ACTIVITY_TYPE_COLORS['Other']
  const c=f.candidate||{}
  const closed=!!f.completed_at
  const overdue=!closed&&f.scheduled_for<today, isToday=!closed&&f.scheduled_for===today
  let dateText,dateCls
  if(closed){ dateText='Closed '+fmtDate(f.completed_at); dateCls='text-emerald-700' }
  else if(overdue){ dateText='Overdue · '+fmtDateOnly(f.scheduled_for); dateCls='text-rose-600 font-medium' }
  else if(isToday){ dateText='Today · '+fmtDateOnly(f.scheduled_for); dateCls='text-amber-700 font-medium' }
  else { dateText=fmtDateOnly(f.scheduled_for); dateCls='text-stone-500' }
  const ownerChip=isAdmin()?'<div class="text-xs text-stone-500 mt-1 flex items-center gap-1.5">'+avatar(f.user_id,'xs')+esc(userName(f.user_id)||'—')+'</div>':''
  const cta=!closed?'<div class="text-xs text-indigo-600 mt-2">Open candidate to log activity →</div>':''
  const outcome=closed&&f.outcome?'<div class="text-sm text-stone-700 mt-1">'+esc(f.outcome)+'</div>':''
  return '<li><a href="#/candidates/'+esc(c.id)+'" class="block px-4 py-3 hover:bg-stone-50 transition"><div class="flex items-start gap-3"><span class="w-2 h-2 rounded-full '+ts.dot+' mt-1.5 shrink-0"></span><div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-3 flex-wrap"><span class="font-medium text-stone-900 truncate">'+esc(c.candidate_name||'Candidate')+'</span><div class="text-xs '+dateCls+'">'+esc(dateText)+'</div></div><div class="text-xs text-stone-500 mt-0.5">'+esc(f.activity_type)+(c.role?' · '+esc(c.role):'')+(c.stage_sub?' · '+esc(c.stage_sub):'')+'</div>'+outcome+ownerChip+cta+'</div></div></a></li>'
}

function pivotVal(dimKey,c){
  if(dimKey==='recruiter') return userName(c.recruiter_user_id)||'Unassigned'
  if(dimKey==='final_status') return c.final_status||'In process'
  return c[dimKey]||'—'
}
function computePivot(rows){
  const p=state.pivot
  const m={}, rowTotals={}, colTotals={}, rowSet=new Set(), colSet=new Set()
  let grand=0
  for(const c of rows){
    const rk=pivotVal(p.rows,c), ck=pivotVal(p.cols,c)
    rowSet.add(rk); colSet.add(ck)
    ;(m[rk]=m[rk]||{})[ck]=(m[rk][ck]||0)+1
    rowTotals[rk]=(rowTotals[rk]||0)+1; colTotals[ck]=(colTotals[ck]||0)+1; grand++
  }
  const order=(set,key,totals)=>{
    if(key==='stage_group') return STAGE_GROUPS.filter(g=>set.has(g)).concat(Array.from(set).filter(k=>!STAGE_GROUPS.includes(k)))
    if(key==='stage_sub'){ const flat=[]; STAGE_GROUPS.forEach(g=>(STAGE_SUBS[g]||[]).forEach(s=>{ if(set.has(s)) flat.push(s) })); return flat.concat(Array.from(set).filter(k=>!flat.includes(k))) }
    return Array.from(set).sort((a,b)=>(totals[b]||0)-(totals[a]||0))
  }
  let rowKeys=order(rowSet,p.rows,rowTotals), colKeys=order(colSet,p.cols,colTotals)
  const MAX_R=80, MAX_C=25
  if(colKeys.length>MAX_C){ const rest=colKeys.slice(MAX_C-1); for(const rk in m){ let o=0; for(const ck of rest){ if(m[rk][ck]){ o+=m[rk][ck]; delete m[rk][ck] } } if(o) m[rk]['Other']=(m[rk]['Other']||0)+o } let ot=0; rest.forEach(k=>{ ot+=colTotals[k]||0; delete colTotals[k] }); colTotals['Other']=(colTotals['Other']||0)+ot; colKeys=colKeys.slice(0,MAX_C-1).concat(['Other']) }
  if(rowKeys.length>MAX_R){ const rest=rowKeys.slice(MAX_R-1); const ob={}; let ot=0; rest.forEach(rk=>{ const r=m[rk]||{}; for(const ck in r) ob[ck]=(ob[ck]||0)+r[ck]; ot+=rowTotals[rk]||0; delete m[rk]; delete rowTotals[rk] }); m['Other']=ob; rowTotals['Other']=ot; rowKeys=rowKeys.slice(0,MAX_R-1).concat(['Other']) }
  let mx=0; for(const rk of rowKeys) for(const ck of colKeys){ const v=(m[rk]&&m[rk][ck])||0; if(v>mx) mx=v }
  p.matrix=m; p.rowKeys=rowKeys; p.colKeys=colKeys; p.rowTotals=rowTotals; p.colTotals=colTotals; p.grand=grand; p.maxCell=mx
}
function exportPivot(){
  const p=state.pivot; if(!p.matrix||!p.grand){ flash('err','Nothing to export'); return }
  const rowLabel=(PIVOT_DIMS.find(d=>d.key===p.rows)||{}).label||'Row'
  const q=(v)=>{ if(v===null||v===undefined) return ''; const s=String(v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s }
  const lines=[[rowLabel,...p.colKeys,'Total'].map(q).join(',')]
  p.rowKeys.forEach(rk=>{ lines.push([rk,...p.colKeys.map(ck=>(p.matrix[rk]&&p.matrix[rk][ck])||0),p.rowTotals[rk]||0].map(q).join(',')) })
  lines.push(['Total',...p.colKeys.map(ck=>p.colTotals[ck]||0),p.grand].map(q).join(','))
  const blob=new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='pivot-'+todayYMD()+'.csv'; a.click(); URL.revokeObjectURL(url)
}

    const body=p.rowKeys.map(rk=>{

      return '<tr class="border-t border-stone-100"><td class="py-1.5 px-3 text-sm font-medium text-stone-800 sticky left-0 bg-white z-10 whitespace-nowrap">'+esc(rk)+'</td>'+cells+'<td class="py-1.5 px-3 text-right text-sm font-semibold text-stone-900 bg-stone-50/60">'+(p.rowTotals[rk]||0)+'</td></tr>'
    }).join('')
    const foot='<tr class="border-t-2 border-stone-200 bg-stone-50"><td class="py-2 px-3 text-left text-sm font-semibold text-stone-900 sticky left-0 bg-stone-50 z-10">Total</td>'+p.colKeys.map(ck=>'<td class="py-2 px-3 text-right text-sm font-semibold text-stone-900">'+(p.colTotals[ck]||0)+'</td>').join('')+'<td class="py-2 px-3 text-right text-sm font-bold text-indigo-700">'+p.grand+'</td></tr>'
    table='<div class="overflow-x-auto border border-stone-200 rounded-lg"><table class="w-full">'+head+'<tbody>'+body+foot+'</tbody></table></div>'
  }
  return '<section class="bg-white border border-stone-200 rounded-lg overflow-hidden mb-6"><header class="px-4 py-3 border-b border-stone-200"><h2 class="text-sm font-semibold text-stone-900">7. Pivot table</h2><p class="text-xs text-stone-500 mt-0.5">Cross-tabulate any two dimensions. Respects the filters and date range above.</p></header><div class="p-4">'+controls+table+'</div></section>'
}

function computeGroupedBreakdown(rows){
  const cols=WORK_MODES
  const groups={}
  const grand={}; cols.forEach(c=>grand[c]=0); grand.total=0
  for(const c of rows){
    const sd=c.sub_department||'—'
    const role=c.role||'—'
    const wm=cols.includes(c.work_mode)?c.work_mode:null
    if(!groups[sd]){ const t={}; cols.forEach(x=>t[x]=0); t.total=0; groups[sd]={roles:{}, totals:t} }
    if(!groups[sd].roles[role]){ const t={}; cols.forEach(x=>t[x]=0); t.total=0; groups[sd].roles[role]=t }
    if(wm){ groups[sd].roles[role][wm]++; groups[sd].totals[wm]++; grand[wm]++ }
    groups[sd].roles[role].total++; groups[sd].totals.total++; grand.total++
  }
  const subDepts=Object.keys(groups).sort((a,b)=>a.localeCompare(b))
  return {groups,subDepts,grand}
}
function renderGroupedBreakdown(){
  const gd=state.pivot.grouped
  if(!gd||!gd.subDepts.length) return '<div class="text-sm text-stone-400 py-10 text-center">No candidates match these filters.</div>'
  const cols=WORK_MODES
  const open=state.groupedOpen
  const colDot=(c)=>{ const s=WORK_MODE_COLORS[c]||{bar:'#94A3B8'}; return '<span class="inline-block w-2 h-2 rounded-full mr-1.5 align-middle" style="background:'+s.bar+'"></span>' }
  const head='<thead><tr class="text-[11px] font-semibold text-stone-500 uppercase tracking-wider border-b-2 border-stone-200"><th class="py-2.5 px-3 text-left" colspan="2">Sub-department / Role</th>'+cols.map(c=>'<th class="py-2.5 px-3 text-center">'+colDot(c)+esc(c)+'</th>').join('')+'<th class="py-2.5 px-3 text-right text-stone-600">Total</th></tr></thead>'
  const badge=(c,v)=>{ if(!v) return '<span class="text-stone-300 text-sm">·</span>'; const s=WORK_MODE_COLORS[c]||{bg:'#F5F5F4',color:'#57534E'}; return '<span class="inline-flex items-center justify-center min-w-[30px] px-2 py-0.5 rounded-md text-xs font-bold" style="background:'+s.bg+';color:'+s.color+'">'+v+'</span>' }
  let body=''
  gd.subDepts.forEach((sd,gi)=>{
    const g=gd.groups[sd]
    const isOpen=open[sd]!==false
    const roleNames=Object.keys(g.roles).sort((a,b)=>a.localeCompare(b))
    const chevron='<span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-indigo-100 text-indigo-600 text-[10px]">'+(isOpen?'▾':'▸')+'</span>'
    body+='<tr class="cursor-pointer transition-colors hover:bg-indigo-50/60" style="background:'+(gi%2===0?'#FAFAF9':'#FFFFFF')+';border-top:1px solid #E7E5E4" data-action="grouped-toggle" data-key="'+esc(sd)+'"><td class="py-2.5 pl-3 pr-1" colspan="2"><div class="flex items-center gap-2"><span class="w-1 self-stretch rounded-full bg-indigo-400" style="min-height:20px"></span>'+chevron+'<span class="text-sm font-semibold text-stone-900">'+esc(sd)+'</span><span class="text-[11px] text-stone-400 font-medium">('+roleNames.length+' '+(roleNames.length===1?'role':'roles')+')</span></div></td>'+cols.map(c=>'<td class="py-2.5 px-3 text-center text-sm font-bold" style="color:'+(g.totals[c]?(WORK_MODE_COLORS[c]||{}).color:'#D6D3D1')+'">'+(g.totals[c]||0)+'</td>').join('')+'<td class="py-2.5 px-3 text-right text-sm font-extrabold text-stone-900">'+g.totals.total+'</td></tr>'
    if(isOpen) roleNames.forEach(role=>{
      const r=g.roles[role]
      body+='<tr class="hover:bg-stone-50 transition-colors" style="border-top:1px solid #F5F5F4"><td class="w-8"></td><td class="py-2 px-3"><div class="flex items-center gap-2"><span class="text-stone-300">└</span><span class="text-sm text-stone-700">'+esc(role)+'</span></div></td>'+cols.map(c=>'<td class="py-2 px-3 text-center">'+badge(c,r[c])+'</td>').join('')+'<td class="py-2 px-3 text-right text-sm font-semibold text-stone-800">'+r.total+'</td></tr>'
    })
  })
  const foot='<tr style="background:linear-gradient(90deg,#EEF2FF,#F5F3FF);border-top:2px solid #C7D2FE"><td class="py-3 px-3 text-sm font-bold text-stone-900" colspan="2">Grand total</td>'+cols.map(c=>'<td class="py-3 px-3 text-center text-sm font-extrabold" style="color:'+((WORK_MODE_COLORS[c]||{}).color||'#57534E')+'">'+(gd.grand[c]||0)+'</td>').join('')+'<td class="py-3 px-3 text-right text-base font-extrabold text-indigo-700">'+gd.grand.total+'</td></tr>'
  return '<div class="overflow-x-auto border border-stone-200 rounded-xl shadow-sm"><table class="w-full border-collapse">'+head+'<tbody>'+body+foot+'</tbody></table></div>'
}
function renderGroupedSection(){
  const loading=state.reportsLoading
  return '<section class="bg-white border border-stone-200 rounded-lg overflow-hidden mb-6"><header class="px-4 py-3 border-b border-stone-200"><h2 class="text-sm font-semibold text-stone-900">8. Sub-department × Role, by work mode</h2><p class="text-xs text-stone-500 mt-0.5">Click a sub-department row to expand or collapse its roles. Respects the date range and pivot filters above.</p></header><div class="p-4">'+(loading?'<div class="text-sm text-stone-500 py-10 text-center">Building breakdown…</div>':renderGroupedBreakdown())+'</div></section>'
}

// ── window helpers for activity form ─────────────────────────────
function updateSubStageOptions(group){ const sub=document.getElementById('act-stage-sub'); if(!sub) return; const subs=STAGE_SUBS[group]||(state.currentCandidate?STAGE_SUBS[state.currentCandidate.stage_group]||[]:[]); sub.innerHTML='<option value="">Keep current</option>'+subs.map(s=>'<option value="'+esc(s)+'">'+esc(s)+'</option>').join(''); toggleActivityFormFields() }
function toggleActivityFormFields(){
  const gS=document.getElementById('act-stage-group'), sS=document.getElementById('act-stage-sub')
  if(!gS||!sS) return
  const sub=sS.value||(state.currentCandidate?.stage_sub||'')
  const iv=document.getElementById('interview-row'); if(iv) iv.style.display=(sS.value&&needsInterview(sS.value))?'':'none'
  const rj=document.getElementById('reject-row'); if(rj) rj.style.display=(sS.value&&isRejectSub(sS.value))?'':'none'
  const noFollowup=isTerminalSub(sub)||state.currentCandidate?.is_archived
  const fu=document.getElementById('followup-row'); if(fu) fu.style.display=noFollowup?'none':''
}
function toggleRejectOther(){ const s=document.getElementById('reject-sel'), o=document.getElementById('reject-other'); if(s&&o) o.style.display=s.value==='Other'?'':'none' }
window.updateSubStageOptions=updateSubStageOptions
window.toggleActivityFormFields=toggleActivityFormFields
window.toggleRejectOther=toggleRejectOther

// ── handlers ─────────────────────────────────────────────────────
let searchDebounce=null
function msArray(key){ if(key==='rf_departments') return state.reportsFilters.departments; if(key==='rf_roles') return state.reportsFilters.roles; if(key==='rf_sources') return state.reportsFilters.sources; return state.filters[key] }
function attachHandlers(){
  const root=document.getElementById('app')
  root.onclick=(e)=>{
    const el=e.target.closest('[data-action]'); if(!el) return
    const action=el.dataset.action, id=el.dataset.id
    if(action==='open-candidate'&&e.target.closest('[data-no-row-click], button, input, label, select, a')) return
    if(action==='login'){ e.preventDefault(); login(); return }
    if(action==='logout'){ e.preventDefault(); logout(); return }
    if(action==='open-candidate'){ window.location.hash='#/candidates/'+encodeURIComponent(id); return }
    if(action==='clear-filters'){ state.filters={ search:'',stageGroup:'',stageSub:'',recruiterId:'',mineOnly:false,departments:[],roles:[],sources:[],workMode:'',noticePeriod:'',archived:'',createdFrom:'',createdTo:'' }; state.filterSearch={}; state.openFilter=null; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render); return }
    if(action==='toggle-mine'){ state.filters.mineOnly=!state.filters.mineOnly; if(state.filters.mineOnly) state.filters.recruiterId=''; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render); return }
    if(action==='page-prev'){ state.candidatesPage=Math.max(1,state.candidatesPage-1); state.selectedIds.clear(); loadCandidates().then(render); return }
    if(action==='page-next'){ state.candidatesPage+=1; state.selectedIds.clear(); loadCandidates().then(render); return }
    if(action==='clear-draft'){ state.newDraft={}; render(); return }
    if(action==='take-ownership'){ takeOwnership(); return }
    if(action==='set-archived'){ setArchived(); return }
    if(action==='clear-archived'){ clearArchived(); return }
    if(action==='enter-edit-mode'){ state.editingCandidate=true; render(); return }
    if(action==='cancel-edit'){ state.editingCandidate=false; render(); return }
    if(action==='clear-selection'){ state.selectedIds.clear(); render(); return }
    if(action==='bulk-delete-confirm'){ state.bulkPanel='delete-confirm'; render(); return }
    if(action==='cancel-bulk'||action==='close-modal'){ state.bulkPanel=null; render(); return }
    if(action==='bulk-delete-execute'){ bulkDelete(); return }
    if(action==='toggle-filter-dropdown'){ state.openFilter=(state.openFilter===el.dataset.key)?null:el.dataset.key; render(); return }
    if(action==='close-filter-dropdown'||action==='filter-dropdown-done'){ state.openFilter=null; render(); return }
    if(action==='filter-dropdown-clear'){ const key=el.dataset.key; const arr=msArray(key); arr.length=0; state.filterSearch[key]=''; if(key.indexOf('rf_')===0){ loadReports() } else { state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) } return }
    if(action==='toggle-sidebar'){ state.sidebarOpen=!state.sidebarOpen; render(); return }
    if(action==='set-role'){ setUserRole(id,el.dataset.role); return }
    if(action==='set-na-filter'){ state.nextActionsFilter=el.dataset.filter; loadNextActions().then(render); return }
    if(action==='export-csv'){ exportCsv(); return }
    if(action==='pivot-export'){ exportPivot(); return }
    if(action==='rf-toggle-mine'){ const f=state.reportsFilters; f.mineOnly=!f.mineOnly; if(f.mineOnly) f.recruiterId=''; loadReports(); return }
    if(action==='rf-clear'){ state.reportsFilters={ search:'', stageGroup:'', stageSub:'', departments:[], roles:[], sources:[], workMode:'', noticePeriod:'', recruiterId:'', mineOnly:false, archived:'' }; loadReports(); return }
    if(action==='grouped-toggle'){ const key=el.dataset.key; const isOpen=state.groupedOpen[key]!==false; state.groupedOpen[key]=!isOpen; render(); return }
    if(action==='open-resume'){ e.preventDefault(); openResume(el.dataset.path); return }
  }
  root.onsubmit=(e)=>{
    const el=e.target.closest('[data-action]'); if(!el) return
    e.preventDefault()
    const action=el.dataset.action
    if(action==='submit-activity') return submitActivity(el)
    if(action==='submit-new-candidate') return submitNewCandidate(el)
    if(action==='save-candidate-edits') return saveCandidateEdits(el)
  }
  root.oninput=(e)=>{
    if(state.view==='candidate-new'){ const form=e.target.closest('form[data-action="submit-new-candidate"]'); if(form) CAND_FIELDS.forEach(f=>{ const el2=form[f]; if(el2) state.newDraft[f]=el2.value }) }
    const el=e.target.closest('[data-action]'); if(!el) return
    if(el.dataset.action==='filter-dropdown-search'){ state.filterSearch[el.dataset.key]=el.value; render(); requestAnimationFrame(()=>{ const box=document.querySelector('[data-action="filter-dropdown-search"][data-key="'+el.dataset.key+'"]'); if(box){ box.focus(); box.setSelectionRange(box.value.length,box.value.length) } }) }
    if(el.dataset.action==='filter-search-input'){ state.filters.search=el.value; clearTimeout(searchDebounce); searchDebounce=setTimeout(()=>{ state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(()=>{ render(); requestAnimationFrame(()=>{ const inp=document.querySelector('[data-action="filter-search-input"]'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length) } }) }) },400) }
    if(el.dataset.action==='rf-search-input'){ state.reportsFilters.search=el.value; clearTimeout(searchDebounce); searchDebounce=setTimeout(()=>{ loadReports().then(()=>{ requestAnimationFrame(()=>{ const inp=document.querySelector('[data-action="rf-search-input"]'); if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length) } }) }) },400) }
    if(el.dataset.action==='bulk-delete-input'){ const ok=el.value.trim()==='delete '+state.selectedIds.size; const btn=document.getElementById('bulk-delete-execute'); if(btn) btn.disabled=!ok }
    if(el.dataset.action==='reports-from-change'){ state.reportsFrom=el.value; loadReports() }
    if(el.dataset.action==='reports-to-change'){ state.reportsTo=el.value; loadReports() }
  }
  root.onchange=(e)=>{
    if(state.view==='candidate-new'){ const form=e.target.closest('form[data-action="submit-new-candidate"]'); if(form) CAND_FIELDS.forEach(f=>{ const el2=form[f]; if(el2) state.newDraft[f]=el2.value }) }
    const el=e.target.closest('[data-action]'); if(!el) return
    const action=el.dataset.action
    if(action==='filter-dropdown-toggle'){ const key=el.dataset.key, val=el.dataset.value; const arr=msArray(key); const idx=arr.indexOf(val); if(el.checked&&idx===-1) arr.push(val); else if(!el.checked&&idx!==-1) arr.splice(idx,1); if(key.indexOf('rf_')===0){ loadReports() } else { state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) } return }
    if(action==='filter-stage-group-change'){ state.filters.stageGroup=el.value; state.filters.stageSub=''; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) }
    if(action==='filter-stage-sub-change'){ state.filters.stageSub=el.value; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) }
    if(action==='filter-recruiter-change'){ state.filters.recruiterId=el.value; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) }
    if(action==='filter-workmode-change'){ state.filters.workMode=el.value; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) }
    if(action==='filter-notice-change'){ state.filters.noticePeriod=el.value; state.candidatesPage=1; state.selectedIds.clear(); loadCandidates().then(render) }
    if(action==='reassign-recruiter'){ reassignRecruiter(el.value) }
    if(action==='toggle-select'){ const cid=Number(el.dataset.id); if(el.checked) state.selectedIds.add(cid); else state.selectedIds.delete(cid); render() }
    if(action==='toggle-select-all'){ if(el.checked) state.candidates.forEach(c=>state.selectedIds.add(c.id)); else state.candidates.forEach(c=>state.selectedIds.delete(c.id)); render() }
    if(action==='bulk-reassign-change'){ const v=el.value; if(v==='') return; if(v==='UNASSIGN') bulkReassign(null); else bulkReassign(v) }
    if(action==='na-owner-change'){ state.nextActionsOwnerFilter=el.value; loadNextActions().then(render) }
    if(action==='pivot-dim-change'){ state.pivot[el.dataset.axis]=el.value; computePivot(state.pivot.raw||[]); render(); if(state.view==='reports') initReportsCharts(); return }
    if(action==='rf-stage-group-change'){ state.reportsFilters.stageGroup=el.value; state.reportsFilters.stageSub=''; loadReports(); return }
    if(action==='rf-stage-sub-change'){ state.reportsFilters.stageSub=el.value; loadReports(); return }
    if(action==='rf-workmode-change'){ state.reportsFilters.workMode=el.value; loadReports(); return }
    if(action==='rf-notice-change'){ state.reportsFilters.noticePeriod=el.value; loadReports(); return }
    if(action==='rf-recruiter-change'){ state.reportsFilters.recruiterId=el.value; loadReports(); return }
    if(action==='rf-archived-change'){ state.reportsFilters.archived=el.value; loadReports(); return }
  }
}

// ── routing ──────────────────────────────────────────────────────
async function handleRoute(){
  state.sidebarOpen=false
  if(!state.session){ state.view='login'; render(); return }
  destroyCharts()
  const hash=window.location.hash.slice(1)||'/'
  state.editingCandidate=false; state.auditLogOpen=false
  if(hash==='/'||hash==='/candidates'){ state.view='candidates-list'; render(); await loadCandidates(); render() }
  else if(hash==='/candidates/new'){ state.view='candidate-new'; state.dupWarning=null; render() }
  else if(hash.startsWith('/candidates/')){ const id=decodeURIComponent(hash.split('/')[2]); state.view='candidate-detail'; state.currentCandidate=null; state.activities=[]; state.auditLog=[]; state.interviews=[]; render(); await Promise.all([loadCandidate(id),loadActivities(id),loadInterviews(id)]); render() }
  else if(hash==='/next-actions'){ state.view='next-actions'; render(); await Promise.all([loadMyOverdueCount(),loadNextActions()]); render() }
  else if(hash==='/team'){ if(!isAdmin()){ window.location.hash='#/candidates'; return } state.view='team'; render(); await Promise.all([loadUsers(),loadCountsByRecruiter()]); render() }
  else if(hash==='/reports'){ if(!isAdmin()){ window.location.hash='#/candidates'; return } state.view='reports'; render(); await loadReports() }
  else window.location.hash='#/candidates'
}

async function init(){
  render()
  const { data:{ session } }=await supabase.auth.getSession()
  if(session){ state.session=session; await Promise.all([loadProfile(),loadUsers(),loadMyOverdueCount()]) }
  supabase.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'){ state.session=session; await Promise.all([loadProfile(),loadUsers(),loadMyOverdueCount()]); handleRoute() }
    else if(event==='SIGNED_OUT'){ state.session=null; state.profile=null; state.view='login'; render() }
  })
  window.addEventListener('hashchange',handleRoute)
  handleRoute()
}
init()
</script>
